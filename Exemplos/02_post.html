<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 — POST (dados no corpo)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; background: #f8fafc; }
    form { max-width: 420px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px;
           box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { color: #6d28d9; font-size: 1.25rem; margin-bottom: 6px; }
    p.sub { color: #64748b; font-size: .85rem; margin-bottom: 18px; }
    label { display: block; font-weight: 700; font-size: .85rem; color: #334155;
            margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px;
            font-family: inherit; font-size: .92rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 18px; padding: 11px; background: #7c3aed; color: #fff;
             border: none; border-radius: 8px; font-weight: 700; font-size: .94rem; cursor: pointer; }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <form method="post">
    <h1>Método POST</h1>
    <p class="sub">Ao enviar, os dados vão no corpo. A URL fica limpa. Em arquivo local,
    o navegador pode reclamar de destino.</p>

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" placeholder="voce@exemplo.com">

    <button type="submit">Enviar por POST</button>
  </form>
</body>
</html>
